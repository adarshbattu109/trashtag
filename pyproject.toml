[project]
name = "trashtag"
version = "0.2.0"
description = "Tag the trash. Flag the roads. — civic pothole & garbage-dump reporting platform"
readme = "README.md"
authors = [
    { name = "Adarsh Battu", email = "adarsh.battu109@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "fastapi-mcp>=0.4.0",
    # fastapi-mcp 0.4.0 declares `mcp>=1.12.0` with no upper bound, but breaks against
    # mcp 2.x (Server.__init__ took a description arg that 2.0 dropped). Cap it here
    # until fastapi-mcp does. Without this an installed wheel crashes on import.
    "mcp<2",
    "pillow>=10.0.0",
    "python-multipart>=0.0.9",
    "uvicorn>=0.42.0",
]

[project.scripts]
trashtag = "trashtag.app:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
# Ruff formats Python code blocks embedded in Markdown; docs snippets are illustrative
# (some are intentionally partial pseudocode), so keep the formatter/linter to real source.
extend-exclude = ["docs"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Query()/Path()/Depends() in argument defaults is the framework idiom, not the
# B008 mutable-default trap — the calls are what wire request parsing to the parameter.
extend-immutable-calls = ["fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=9.1.1",
    "ruff>=0.16",
]
